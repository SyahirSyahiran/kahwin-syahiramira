<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f1eb">
    <title>Walimatulrus | Amira &amp; Syahir</title>
    <style>
        :root { --ink:#493b36; --muted:#806f67; --rose:#a86668; --rose-dark:#8e5356; --leaf:#849078; }
        * { box-sizing:border-box; }
        body {
            position:relative; isolation:isolate;
            margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 20px;
            color:var(--ink); font-family:Georgia,'Times New Roman',serif; text-align:center;
            background-color:#f5ece5;
            background-image:
                radial-gradient(ellipse at 50% 50%, rgba(255,250,246,.4), transparent 68%),
                radial-gradient(circle at 20px 20px, rgba(168,102,104,.14) 1.2px, transparent 1.8px),
                radial-gradient(circle at 0 0, rgba(132,144,120,.12) 1px, transparent 1.7px),
                linear-gradient(135deg,#fbf5ef,#eadbd2);
            background-size:auto, 40px 40px, 40px 40px, auto;
            background-position:center, 0 0, 20px 20px, center;
        }
        /* Cahaya warna lembut bergerak perlahan untuk kesan live background. */
        body::before {
            position:fixed; z-index:-1; inset:-25%; content:""; pointer-events:none;
            background:
                radial-gradient(ellipse at 18% 28%, rgba(212,154,157,.22), transparent 30%),
                radial-gradient(ellipse at 78% 68%, rgba(155,171,139,.2), transparent 32%),
                radial-gradient(ellipse at 55% 12%, rgba(255,255,255,.55), transparent 35%);
            background-size:150% 150%;
            animation:softBloom 24s ease-in-out infinite alternate;
        }
        .invitation {
            position:relative; width:min(100%,470px); padding:58px 34px 42px; overflow:hidden;
            background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.95),transparent 55%),rgba(255,250,246,.96);
            border:1px solid rgba(168,102,104,.3); border-radius:220px 220px 28px 28px;
            box-shadow:0 24px 70px rgba(73,59,54,.16); animation:arrive .8s ease-out both;
        }
        .invitation::before,.invitation::after { position:absolute; color:rgba(168,102,104,.2); font-size:88px; line-height:1; pointer-events:none; }
        .invitation::before { content:"✿"; top:20px; left:16px; transform:rotate(-24deg); }
        .invitation::after { content:"❀"; right:14px; bottom:12px; transform:rotate(20deg); }
        .floral-sprig { position:absolute; color:rgba(132,144,120,.58); font-size:1.6rem; pointer-events:none; }
        .sprig-left { top:155px; left:20px; transform:rotate(-28deg); }
        .sprig-right { top:155px; right:20px; transform:scaleX(-1) rotate(-28deg); }
        .eyebrow { margin:0 0 20px; color:var(--rose); font-family:Arial,sans-serif; font-size:.72rem; letter-spacing:.24em; text-transform:uppercase; }
        .divider { display:flex; align-items:center; justify-content:center; gap:12px; margin:0 auto 18px; color:var(--rose); font-size:1.15rem; }
        .divider::before,.divider::after { width:42px; height:1px; content:""; background:linear-gradient(90deg,transparent,#d7b8ad); }
        .divider::after { transform:scaleX(-1); }
        h1 { margin:0; font-size:clamp(2.5rem,11vw,3.8rem); font-weight:normal; line-height:1.05; }
        .ampersand { display:block; margin:5px 0; color:var(--rose); font-size:2rem; font-style:italic; }
        .message { max-width:310px; margin:24px auto 0; color:var(--muted); font-size:1rem; line-height:1.7; }
        .button {
            position:relative; z-index:1; display:inline-flex; align-items:center; justify-content:center; gap:10px;
            width:100%; min-height:54px; margin-top:30px; padding:14px 20px; color:white;
            background:linear-gradient(135deg,#b97879,var(--rose-dark)); border:0; border-radius:999px;
            box-shadow:0 8px 20px rgba(142,83,86,.23); font-family:Arial,sans-serif; font-size:.95rem;
            font-weight:700; letter-spacing:.04em; cursor:pointer;
            transition:background .2s ease,transform .2s ease,box-shadow .2s ease;
        }
        .button:hover { background:linear-gradient(135deg,var(--rose),var(--rose-dark)); box-shadow:0 11px 24px rgba(142,83,86,.3); transform:translateY(-2px); }
        .button:focus-visible { outline:3px solid #d6a5a0; outline-offset:4px; }
        .footer { margin:22px 0 0; color:#a38e84; font-family:Arial,sans-serif; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; }
        .footer::before { display:block; margin-bottom:10px; color:var(--leaf); content:"❧  ✿  ❧"; font-size:1rem; letter-spacing:.2em; }
        @keyframes softBloom {
            0% { transform:translate3d(-2%, -1%, 0) rotate(0deg) scale(1); }
            50% { transform:translate3d(2%, 1%, 0) rotate(3deg) scale(1.04); }
            100% { transform:translate3d(-1%, 2%, 0) rotate(-2deg) scale(1.02); }
        }
        @keyframes arrive { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
        @media (max-width:380px) { .invitation { padding:54px 25px 36px; } .sprig-left { left:12px; } .sprig-right { right:12px; } }
        @media (prefers-reduced-motion:reduce) {
            *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
            body::before { animation:none; }
        }
    </style>
</head>
<body>
    <main class="invitation">
        <span class="floral-sprig sprig-left" aria-hidden="true">❧</span>
        <span class="floral-sprig sprig-right" aria-hidden="true">❧</span>
        <p class="eyebrow">Walimatulurus</p>
        <div class="divider" aria-hidden="true">✿</div>
        <h1>Amira<span class="ampersand">&amp;</span>Syahir</h1>
        <p class="message">Dengan penuh kesyukuran dan sukacita, kami menjemput anda meraikan hari bahagia kami.</p>
        <button class="button" id="openBtn" type="button"><span aria-hidden="true">♡</span> INVITATION CARD</button>
        <p class="footer">Dengan kasih, kami menanti kehadiran anda</p>
    </main>
    <!-- Letakkan Music2.mp3 dalam folder yang sama dengan fail HTML ini. -->
    <audio id="bgMusic2" loop preload="auto">
        <source src="Music2.mp3" type="audio/mpeg">
        Pelayar anda tidak menyokong audio.
    </audio>
    <script>
        const audio = document.getElementById('bgMusic2');
        const openBtn = document.getElementById('openBtn');
        const rsvpUrl = 'https://flying-lemur-9kfrww.my.canva.site/perkahwinan-syahiramira';
        openBtn.addEventListener('click', async () => {
            // Buka RSVP di tab baharu supaya halaman ini kekal terbuka untuk memainkan lagu.
            window.open(rsvpUrl, '_blank', 'noopener,noreferrer');
            try { await audio.play(); }
            catch (error) { console.error('Audio playback failed:', error); }
        });
    </script>
</body>
</html>
