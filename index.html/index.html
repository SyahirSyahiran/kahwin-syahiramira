<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Perkahwinan</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #111827;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .box {
            box-sizing: border-box;
            background: #1f2937;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: min(400px, 90%);
        }
        .btn {
            display: block;
            box-sizing: border-box;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            padding: 14px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            cursor: pointer;
            border: none;
            width: 100%;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        #statusText {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #d1d5db;
        }
    </style>
</head>
<body>
    <main class="box">
        <h2>Undangan Perkahwinan</h2>
        <p id="statusText">Tekan butang untuk mula memainkan lagu dan membuka jemputan.</p>
        <button class="btn" id="openBtn" type="button">Buka Laman RSVP 💌</button>
    </main>

    <!-- Pastikan fail Music.mp3 berada di lokasi yang sama dengan fail HTML ini. -->
    <audio id="bgMusic" loop preload="auto">
        <source src="Music.mp3" type="audio/mpeg">
        Pelayar anda tidak menyokong audio.
    </audio>

    <script>
        const audio = document.getElementById('bgMusic');
        const openBtn = document.getElementById('openBtn');
        const statusText = document.getElementById('statusText');
        const rsvpUrl = 'https://flying-lemur-9kfrww.my.canva.site/perkahwinan-syahiramira';

        openBtn.addEventListener('click', async () => {
            // Buka RSVP di tab baharu supaya halaman ini kekal terbuka untuk memainkan lagu.
            const rsvpTab = window.open(rsvpUrl, '_blank');

            try {
                await audio.play();
                statusText.textContent = 'Lagu sedang dimainkan. Halaman RSVP dibuka di tab baharu 🎶';
            } catch (error) {
                statusText.textContent = 'Laman RSVP dibuka. Jika lagu tidak berbunyi, semak fail Music.mp3 dan cuba tekan butang sekali lagi.';
            }

            if (!rsvpTab) {
                statusText.textContent = 'Pelayar menyekat tab baharu. Benarkan pop-up atau buka pautan RSVP secara manual. Lagu akan dimainkan di halaman ini selepas butang ditekan.';
            }
        });
    </script>
</body>
</html>
