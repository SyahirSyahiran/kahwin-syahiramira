<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f1eb">
    <title>Jemputan Perkahwinan | Syahir &amp; Amira</title>
    <style>
        :root {
            --ink: #493b36;
            --muted: #806f67;
            --rose: #a86668;
            --rose-dark: #8e5356;
            --paper: #fffaf6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            font-family: Georgia, 'Times New Roman', serif;
            text-align: center;
            background:
                radial-gradient(ellipse at 12% 12%, rgba(255,255,255,.9), transparent 38%),
                radial-gradient(ellipse at 90% 85%, rgba(225,190,177,.45), transparent 40%),
                linear-gradient(135deg, #f8f1eb, #eadbd2);
        }

        .invitation {
            position: relative;
            width: min(100%, 470px);
            padding: 52px 34px 42px;
            overflow: hidden;
            background: rgba(255, 250, 246, .94);
            border: 1px solid rgba(168, 102, 104, .28);
            border-radius: 220px 220px 24px 24px;
            box-shadow: 0 24px 70px rgba(73, 59, 54, .16);
            animation: arrive .8s ease-out both;
        }

        .invitation::before,
        .invitation::after {
            position: absolute;
            content: "✿";
            color: rgba(168, 102, 104, .22);
            font-size: 88px;
            line-height: 1;
            pointer-events: none;
        }
        .invitation::before { top: 24px; left: 18px; transform: rotate(-24deg); }
        .invitation::after { right: 18px; bottom: 18px; transform: rotate(22deg); }

        .eyebrow {
            margin: 0 0 20px;
            color: var(--rose);
            font-family: Arial, sans-serif;
            font-size: .72rem;
            letter-spacing: .24em;
            text-transform: uppercase;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 18px;
            color: var(--rose);
            font-size: 1.15rem;
        }
        .divider::before,
        .divider::after {
            width: 42px;
            height: 1px;
            content: "";
            background: #d7b8ad;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 11vw, 3.8rem);
            font-weight: normal;
            line-height: 1.05;
        }
        .ampersand {
            display: block;
            margin: 5px 0;
            color: var(--rose);
            font-size: 2rem;
            font-style: italic;
        }
        .message {
            max-width: 310px;
            margin: 24px auto 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
        }

        .button {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 54px;
            margin-top: 30px;
            padding: 14px 20px;
            color: white;
            background: var(--rose);
            border: 0;
            border-radius: 999px;
            box-shadow: 0 8px 20px rgba(142, 83, 86, .23);
            font-family: Arial, sans-serif;
            font-size: .95rem;
            font-weight: 700;
            letter-spacing: .04em;
            cursor: pointer;
            transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
        }
        .button:hover {
            background: var(--rose-dark);
            box-shadow: 0 11px 24px rgba(142, 83, 86, .3);
            transform: translateY(-2px);
        }
        .button:focus-visible { outline: 3px solid #d6a5a0; outline-offset: 4px; }

        .footer {
            position: relative;
            z-index: 1;
            margin: 22px 0 0;
            color: #a38e84;
            font-family: Arial, sans-serif;
            font-size: .7rem;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="invitation">
        <p class="eyebrow">Jemputan Perkahwinan</p>
        <div class="divider" aria-hidden="true">❦</div>
        <h1>Syahir<span class="ampersand">&amp;</span>Amira</h1>
        <p class="message">Dengan penuh kesyukuran dan sukacita, kami menjemput anda meraikan hari bahagia kami.</p>
        <button class="button" id="openBtn" type="button">
            <span aria-hidden="true">♡</span> INVITATION CARD
        </button>
        <p class="footer">Dengan kasih, kami menanti kehadiran anda</p>
    </main>

    <!-- Letakkan Music.mp3 dalam folder yang sama dengan fail HTML ini. -->
    <audio id="bgMusic1" loop preload="auto">
        <source src="Music1.mp3" type="audio/mpeg">
        Pelayar anda tidak menyokong audio.
    </audio>

    <script>
        const audio = document.getElementById('bgMusic1');
        const openBtn = document.getElementById('openBtn');
        const rsvpUrl = 'https://flying-lemur-9kfrww.my.canva.site/perkahwinan-syahiramira';

        openBtn.addEventListener('click', async () => {
            // Buka RSVP di tab baharu supaya halaman ini kekal terbuka untuk memainkan lagu.
            window.open(rsvpUrl, '_blank', 'noopener,noreferrer');

            try {
                await audio.play();
            } catch (error) {
                // Audio might not be available or playback may be blocked by the browser.
                console.error('Audio playback failed:', error);
            }
        });
    </script>
</body>
</html>
